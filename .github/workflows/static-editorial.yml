name: Static editorial executor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Safe static editorial operation
        required: true
        type: choice
        options:
          - reconcile-only
          - schedule-approved

permissions:
  contents: read

concurrency:
  group: troco-static-editorial
  cancel-in-progress: false

jobs:
  access-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the pinned executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.14.1"
          registry-url: https://npm.pkg.github.com
      - name: Install locked dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm ci
      - name: Create a scoped private-editorial token
        id: private-editorial-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.STATIC_GITHUB_APP_ID }}
          private-key: ${{ secrets.STATIC_GITHUB_APP_PRIVATE_KEY }}
          owner: trocohq
          repositories: editorial-inputs
      - name: Verify pinned private access
        env:
          STATIC_EDITORIAL_REPOSITORY: ${{ vars.STATIC_EDITORIAL_REPOSITORY }}
          STATIC_EDITORIAL_REPOSITORY_ID: ${{ vars.STATIC_EDITORIAL_REPOSITORY_ID }}
          STATIC_EDITORIAL_REF: ${{ vars.STATIC_EDITORIAL_REF }}
          PRIVATE_EDITORIAL_TOKEN: ${{ steps.private-editorial-token.outputs.token }}
        run: npm run --silent static:access-check

  execute:
    if: >-
      vars.STATIC_EDITORIAL_ENABLED == 'true' &&
      vars.ZERO_COST_CONFIRMED == 'true' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'reconcile-only' ||
      (inputs.mode == 'schedule-approved' && github.actor == 'GuilhermeAlbert'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pinned executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.14.1"
          registry-url: https://npm.pkg.github.com
      - name: Install locked dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: npm ci
      - name: Create a scoped private-editorial token
        id: private-editorial-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.STATIC_GITHUB_APP_ID }}
          private-key: ${{ secrets.STATIC_GITHUB_APP_PRIVATE_KEY }}
          owner: trocohq
          repositories: editorial-inputs
      - name: Execute the bounded private calendar
        env:
          STATIC_EXECUTION_MODE: ${{ (github.event_name == 'schedule' || inputs.mode == 'schedule-approved') && 'scheduled' || 'reconcile-only' }}
          STATIC_OWNER_SCHEDULE_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'schedule-approved' && github.actor == 'GuilhermeAlbert' && 'true' || 'false' }}
          STATIC_EDITORIAL_ENABLED: ${{ vars.STATIC_EDITORIAL_ENABLED || 'false' }}
          ZERO_COST_CONFIRMED: ${{ vars.ZERO_COST_CONFIRMED || 'false' }}
          STATIC_EDITORIAL_REPOSITORY: ${{ vars.STATIC_EDITORIAL_REPOSITORY }}
          STATIC_EDITORIAL_REPOSITORY_ID: ${{ vars.STATIC_EDITORIAL_REPOSITORY_ID }}
          STATIC_EDITORIAL_REF: ${{ vars.STATIC_EDITORIAL_REF }}
          STATIC_EDITORIAL_MANIFEST_PATH: ${{ vars.STATIC_EDITORIAL_MANIFEST_PATH }}
          STATIC_MEDIA_ORIGIN: ${{ vars.STATIC_MEDIA_ORIGIN }}
          PRIVATE_EDITORIAL_TOKEN: ${{ steps.private-editorial-token.outputs.token }}
          STATIC_STATE_TOKEN: ${{ steps.private-editorial-token.outputs.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
        run: npm run --silent static:execute -- --mode "$STATIC_EXECUTION_MODE"
