name: Static editorial executor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Safe static editorial operation
        required: true
        type: choice
        options:
          - reconcile-only

permissions:
  contents: read

concurrency:
  group: troco-static-editorial
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      vars.STATIC_EDITORIAL_ENABLED == 'true' &&
      vars.ZERO_COST_CONFIRMED == 'true' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'reconcile-only'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pinned executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.14.1"
      - name: Install locked dependencies
        run: npm ci
      - name: Execute the bounded private calendar
        env:
          STATIC_EXECUTION_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || 'reconcile-only' }}
          STATIC_EDITORIAL_ENABLED: ${{ vars.STATIC_EDITORIAL_ENABLED || 'false' }}
          ZERO_COST_CONFIRMED: ${{ vars.ZERO_COST_CONFIRMED || 'false' }}
          STATIC_EDITORIAL_REPOSITORY: ${{ vars.STATIC_EDITORIAL_REPOSITORY }}
          STATIC_EDITORIAL_REPOSITORY_ID: ${{ vars.STATIC_EDITORIAL_REPOSITORY_ID }}
          STATIC_EDITORIAL_REF: ${{ vars.STATIC_EDITORIAL_REF }}
          PRIVATE_EDITORIAL_TOKEN: ${{ secrets.PRIVATE_EDITORIAL_READ_TOKEN }}
          STATIC_STATE_TOKEN: ${{ secrets.STATIC_STATE_WRITE_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: npm run --silent static:execute -- --mode "$STATIC_EXECUTION_MODE"
